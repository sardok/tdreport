[package]
name = "kvm-runner"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
env_logger = "0.11"
log = "0.4"
nix = { version = "0.31.3", features = ["ioctl", "mman", "signal"] }
td-shim-interface = { path = "../third_party/td-shim/td-shim-interface" }
